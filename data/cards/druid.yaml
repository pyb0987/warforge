  dr_world:
    name: 세계수
    tier: 5
    theme: druid
    comp:
    - unit: dr_treant_a
      n: 2
    - unit: dr_spirit
      n: 1
    tags:
    - druid
    - worldtree
    impl: theme_system
    # 2026-04-28 재설계: 매 라운드 누적형 단일 증분.
    #   ★N 마다 floor(trees/tree_step) * per_step 만큼 ATK/HP/AS 가 함께 증가.
    #   per_step 은 atk/hp/as 공통, tree_step 만 ★별 차이 (30/20/5).
    #   AS 도 동일 부호로 적용 — druid_system 에서 unique_as_mult 를 1/(1+buff)
    #   로 환산하여 공격 속도가 빨라지도록 처리 (combat 측에서 attack_speed *=).
    stars:
      1:
        effects:
        - trigger_timing: RS
          max_act: -1
          tree_add:
          - target: self
            count: 2
          - target: all_other_druid
            count: 1
          multiply_stats:
            target: all_allies
            tree_source: forest_depth
            per_step: 0.05
            tree_step: 30
        - trigger_timing: BS
          max_act: -1
          tree_combat_bonus:
            target: self
            per_tree_pct: 0.05
            cap_pct: 0.6
      2:
        effects:
        - trigger_timing: RS
          max_act: -1
          tree_add:
          - target: self
            count: 3
          - target: all_other_druid
            count: 2
          multiply_stats:
            target: all_allies
            tree_source: forest_depth
            per_step: 0.05
            tree_step: 20
        - trigger_timing: BS
          max_act: -1
          tree_combat_bonus:
            target: self
            per_tree_pct: 0.05
            cap_pct: 0.6
      3:
        effects:
        - trigger_timing: RS
          max_act: -1
          tree_add:
          - target: self
            count: 3
          - target: all_other_druid
            count: 2
          multiply_stats:
            target: all_allies
            tree_source: forest_depth
            per_step: 0.05
            tree_step: 5
        - trigger_timing: BS
          max_act: -1
          tree_combat_bonus:
            target: self
            per_tree_pct: 0.05
            cap_pct: 0.6
